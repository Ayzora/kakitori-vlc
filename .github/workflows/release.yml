name: Release

# Push a tag such as v1.0.0 to build all three platforms and publish a GitHub
# Release. Every release carries the same file names, so
# releases/latest/download/<file> always points at the newest version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      # Let every platform finish, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            bun-target: bun-windows-x64
            ffmpeg-target: windows-x64
            exe: .exe
            flags: --windows-hide-console
          - platform: macos-arm64
            runner: macos-latest
            bun-target: bun-darwin-arm64
            ffmpeg-target: darwin-arm64
          - platform: macos-x64
            runner: macos-latest
            bun-target: bun-darwin-x64
            ffmpeg-target: darwin-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        working-directory: core
        run: bun install --frozen-lockfile
      # bun build doesn't create the output folder on Windows.
      - name: Create the package folder
        run: mkdir -p package/bin
      - name: Compile the core
        working-directory: core
        run: >
          bun build --compile --target=${{ matrix.bun-target }} ${{ matrix.flags }}
          --no-compile-autoload-dotenv --no-compile-autoload-bunfig
          src/index.ts --outfile ../package/bin/kakitori${{ matrix.exe }}
      - name: Add ffmpeg and ffprobe
        working-directory: core
        run: bun scripts/fetch-ffmpeg.ts ${{ matrix.ffmpeg-target }} ../package/bin
      - name: Add the extension and documents
        run: cp extension/kakitori.lua README.md LICENSE THIRD_PARTY.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: kakitori-${{ matrix.platform }}
          path: package/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip each platform and prepare the scripts
        run: |
          mkdir dist
          for dir in artifacts/kakitori-*; do
            name="$(basename "$dir")"
            # Artifacts lose the executable bit; the macOS installer sets it
            # again, but keep the zips right too.
            chmod +x "$dir"/bin/*
            (cd "$dir" && zip -qr "../../dist/$name.zip" .)
          done
          for script in install.sh uninstall.sh install.ps1 uninstall.ps1; do
            sed "s|__REPO__|$GITHUB_REPOSITORY|g" "install/$script" > "dist/$script"
          done
          (cd dist && sha256sum kakitori-*.zip > SHA256SUMS.txt)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Kakitori $GITHUB_REF_NAME" --generate-notes
